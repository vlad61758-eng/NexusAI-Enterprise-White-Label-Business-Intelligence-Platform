<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-panel:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.3);
        }
        .neon-text {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-16 relative">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-sky-500 rounded-full blur-[100px] opacity-20"></div>
            <h1 class="text-4xl md:text-6xl font-bold mb-4 relative z-10">Premium <span class="neon-text">Telegram Bots</span></h1>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto relative z-10">Автоматизуйте свій бізнес, продажі та модерацію за допомогою готових AI-скриптів. Миттєва доставка після оплати в USDT.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for product in products %}
            <div class="glass-panel rounded-2xl p-6 flex flex-col h-full relative overflow-hidden">
                <div class="text-4xl mb-4">{{ product.icon }}</div>
                <h2 class="text-xl font-bold mb-2 text-white">{{ product.name }}</h2>
                <p class="text-slate-400 text-sm mb-6 flex-grow">{{ product.description }}</p>

                <div class="flex items-center justify-between mt-auto">
                    <span class="text-2xl font-bold neon-text">${{ product.price }}</span>
                    <a href="/checkout/{{ product.id }}" class="bg-sky-500/20 text-sky-400 border border-sky-500/50 hover:bg-sky-500 hover:text-white px-4 py-2 rounded-lg font-medium transition duration-200">
                        Придбати
                    </a>
                </div>
            </div>
            {% end endfor %}
        </div>
    </div>

</body>
</html>
